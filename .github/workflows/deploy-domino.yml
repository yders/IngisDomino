name: Deploy Domino app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "client/public/domino/**"
      - ".github/workflows/deploy-domino.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # enablement: true creates the Pages site on first run, so no manual
      # repo-settings step is needed.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload domino app
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/public/domino

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
